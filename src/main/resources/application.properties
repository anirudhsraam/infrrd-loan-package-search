spring.application.name=infrrd-mortgage-loan-review-search
server.port=9090
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.tomcat.threads.max=64
server.tomcat.max-connections=256
server.tomcat.accept-count=128
spring.jackson.default-property-inclusion=non_null
app.project-root=${APP_PROJECT_ROOT:.}
app.package-manifest=${APP_PACKAGE_MANIFEST:package.json}
app.data-dir=${APP_DATA_DIR:data}
logging.level.ai.infrrd.loansearch=INFO
